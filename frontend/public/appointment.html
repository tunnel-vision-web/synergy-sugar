<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Appointment - Synergy Bravo ERP</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2" />
  <link rel="apple-touch-icon" href="favicon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/sansation" rel="stylesheet">

    <style>
    :root {
      --primary: #f6dd0d;
      --secondary: #686fb4;
      --dark-sage: #16221c;
      --gray: #64748b;
      --text: #475569;
      --text-strong: #0f172a;
      --bg: #f8fafc;
      --border: #cbd5e1;
      --radius: 8px;
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
      --headerH: 84px;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* HEADER - Dark Sage */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: #16221c;
      border-bottom: 1px solid #283a31;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1200px, 92vw);
      margin: 0 auto;
      height: var(--headerH);
      padding: 8px 0;
    }
    .logo img {
      height: 66px;
      display: block;
    }
    .nav {
      display: flex;
      gap: 24px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .nav a {
      color: #f8fafc;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav a:hover {
      color: var(--primary);
    }
    .header-cta { display: flex; gap: 12px; align-items: center; }

    .btn {
      border: none;
      border-radius: 3px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #16201c;
      background: var(--primary);
      padding: 10px 20px;
      font-size: 0.9rem;
    }
    .btn:hover {
      background: #ffe436;
      box-shadow: 0 4px 14px rgba(246, 221, 13, 0.4);
    }
    .btn-light {
      background: rgba(255,255,255,0.12);
      color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3px;
    }
    .btn-light:hover {
      background: var(--primary);
      color: #16201c;
    }

    /* HERO SECTION */
    .hero {
      padding-top: calc(var(--headerH) + 24px);
      padding-bottom: 24px;
      background: #16221c;
      border-bottom: 3px solid #f6dd0d;
      margin-bottom: 32px;
    }
    .hero-content {
      width: min(1200px, 92vw);
      margin: 0 auto;
    }
    .hero-content h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Sansation', 'Roboto', sans-serif;
    }
    .hero-content p {
      color: #cbd5e1;
      margin: 8px 0 0 0;
      font-size: 1.05rem;
    }

    /* PAGE CONTENT */
    .page { width: min(1200px, 92vw); margin: 0 auto 40px auto; }
    .card { background: #ffffff; border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,0.05); }

    /* APPOINTMENT CARD */
    .appointment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; margin-top: 24px; }
    .appointment-card {
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .appointment-card:hover {
      transform: translateY(-4px);
      border-color: #f6dd0d;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }
    .appointment-card-header {
      background: #16221c;
      padding: 20px;
      border-bottom: 3px solid #f6dd0d;
    }
    .appointment-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f6dd0d;
      margin: 0 0 8px;
      font-family: 'Sansation', 'Roboto', sans-serif;
    }
    .appointment-meta { display: flex; gap: 16px; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #cbd5e1; font-weight: 500; }
    .meta-item.online { color: #f6dd0d; }

    .appointment-card-body { padding: 20px; }
    .description { font-size: 0.95rem; line-height: 1.6; color: #475569; margin-bottom: 20px; }
    .book-btn {
      width: 100%;
      background: #16221c;
      color: #f6dd0d;
      border: 1px solid #f6dd0d;
      padding: 12px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .book-btn:hover {
      background: #f6dd0d;
      color: #16201c;
    }

    /* BOOKING CONTAINER */
    .booking-container { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-top: 24px; }
    @media(max-width:768px){ .booking-container { grid-template-columns: 1fr; } }

    .calendar-section, .booking-summary, .form-container {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .calendar-header h2, .summary-value, .form-group label {
      color: #0f172a;
    }
    .calendar-day, .time-slot {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      border-radius: 4px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .calendar-day:not(.disabled):hover, .time-slot:hover {
      background: #f6dd0d;
      border-color: #f6dd0d;
      color: #16201c;
      font-weight: 700;
    }
    .calendar-day.selected, .time-slot.selected {
      background: #16221c;
      color: #f6dd0d;
      border-color: #f6dd0d;
      font-weight: 700;
    }
    .calendar-day.today {
      border-color: #f6dd0d;
      font-weight: 700;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.95rem;
      color: #0f172a;
      background: #ffffff;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #f6dd0d;
      box-shadow: 0 0 0 3px rgba(246, 221, 13, 0.25);
    }

    /* FOOTER */
    .site-footer {
      background: #16221c;
      color: #f8fafc;
      margin-top: 56px;
      padding: 40px 20px;
      border-top: 3px solid #f6dd0d;
    }
</style>
