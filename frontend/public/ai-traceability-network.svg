<svg viewBox="0 0 1600 1200" width="1600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Curved arrows connecting in a circle -->
  <defs>
    <marker id="arrowhead" markerWidth="20" markerHeight="20" refX="18" refY="6" orient="auto">
      <polygon points="0 0, 20 6, 0 12" fill="#686fb4" />
    </marker>
  </defs>
  
  <!-- Arrow 1: Cane to Transport (top to right) -->
  <path d="M 800 240 Q 1040 300, 1160 480" stroke="#686fb4" stroke-width="6" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Arrow 2: Transport to Weighbridge (right to bottom) -->
  <path d="M 1200 560 Q 1160 800, 960 960" stroke="#686fb4" stroke-width="6" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Arrow 3: Weighbridge to Labor (bottom to left) -->
  <path d="M 640 960 Q 440 800, 400 560" stroke="#686fb4" stroke-width="6" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Arrow 4: Labor to Cane (left to top) -->
  <path d="M 440 480 Q 480 300, 720 240" stroke="#686fb4" stroke-width="6" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Center Circle - AI -->
  <circle cx="800" cy="600" r="160" fill="#f6dd0d" stroke="#686fb4" stroke-width="6"/>
  <text x="800" y="630" text-anchor="middle" font-size="84" font-weight="700" fill="#3b3b3b" font-family="'Sansation', 'Roboto', Arial, sans-serif">AI</text>
  
  <!-- Card 1: Cane Sourcing (Top) -->
  <g>
    <rect x="600" y="80" width="400" height="140" rx="6" fill="#A7F3D0" stroke="#059669" stroke-width="4"/>
    <text x="800" y="135" text-anchor="middle" font-size="32" font-weight="600" fill="#059669" font-family="'Roboto', Arial, sans-serif">Cane Sourcing</text>
    <text x="800" y="180" text-anchor="middle" font-size="32" font-weight="600" fill="#059669" font-family="'Roboto', Arial, sans-serif">Traceability</text>
  </g>
  
  <!-- Card 2: Transport & Workshop (Right) -->
  <g>
    <rect x="1200" y="480" width="360" height="160" rx="6" fill="#FED7AA" stroke="#EA580C" stroke-width="4"/>
    <text x="1380" y="535" text-anchor="middle" font-size="30" font-weight="600" fill="#EA580C" font-family="'Roboto', Arial, sans-serif">Transport &amp;</text>
    <text x="1380" y="575" text-anchor="middle" font-size="30" font-weight="600" fill="#EA580C" font-family="'Roboto', Arial, sans-serif">Workshop</text>
    <text x="1380" y="615" text-anchor="middle" font-size="30" font-weight="600" fill="#EA580C" font-family="'Roboto', Arial, sans-serif">Traceability</text>
  </g>
  
  <!-- Card 3: Weighbridge (Bottom) -->
  <g>
    <rect x="600" y="980" width="400" height="140" rx="6" fill="#DDD6FE" stroke="#7C3AED" stroke-width="4"/>
    <text x="800" y="1035" text-anchor="middle" font-size="32" font-weight="600" fill="#7C3AED" font-family="'Roboto', Arial, sans-serif">Weighbridge</text>
    <text x="800" y="1080" text-anchor="middle" font-size="32" font-weight="600" fill="#7C3AED" font-family="'Roboto', Arial, sans-serif">Traceability</text>
  </g>
  
  <!-- Card 4: Labor (Left) -->
  <g>
    <rect x="40" y="480" width="360" height="160" rx="6" fill="#FBCFE8" stroke="#DB2777" stroke-width="4"/>
    <text x="220" y="555" text-anchor="middle" font-size="32" font-weight="600" fill="#DB2777" font-family="'Roboto', Arial, sans-serif">Labor</text>
    <text x="220" y="595" text-anchor="middle" font-size="32" font-weight="600" fill="#DB2777" font-family="'Roboto', Arial, sans-serif">Traceability</text>
  </g>
</svg>
