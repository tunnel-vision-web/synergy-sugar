<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Traceability Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/sansation" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Roboto', sans-serif;
    }
    .diagram-container {
      width: 1600px;
      height: 1200px;
      background: #ffffff;
    }
  </style>
<style id="phoneResponsiveStyle">
/* ═══════════════════════════════════════════════════════
   PHONE VIEWPORT (<= 768px) — DEFINITIVE RESPONSIVE CSS
   ═══════════════════════════════════════════════════════ */
@media (max-width: 768px) {

  /* Header shell */
  .site-header {
    height: 56px !important;
    min-height: 56px !important;
    padding: 0 !important;
  }

  /* Inner flex row: logo left, hamburger right */
  .site-header .inner {
    padding: 0 14px !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    height: 56px !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    overflow: visible !important;
  }

  /* Logo */
  .site-header .brand img {
    height: 32px !important;
  }
  .site-header.scrolled .brand img {
    height: 28px !important;
  }

  /* Nav: hidden on phone */
  .site-header .main-nav {
    display: none !important;
  }

  /* Right-side group: simple row, hugging the right */
  .header-right-group {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 0 !important;
    margin-left: auto !important;
    flex-shrink: 0 !important;
    overflow: visible !important;
  }

  /* Auth actions: hidden on phone (country, sign in, yellow button all hidden) */
  .site-header .auth-actions {
    display: none !important;
  }

  /* ---- HAMBURGER: ALWAYS VISIBLE on phone ---- */
  /* Override the base .hamburger-menu { display: none !important } with higher specificity */
  .site-header .hamburger-menu,
  .header-right-group .hamburger-menu,
  body .site-header .hamburger-menu {
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    gap: 5px !important;
    width: 28px !important;
    height: 28px !important;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    cursor: pointer !important;
    z-index: 10005 !important;
    flex-shrink: 0 !important;
    visibility: visible !important;
    opacity: 1 !important;
    margin: 0 !important;
  }
  .site-header .hamburger-menu span,
  .header-right-group .hamburger-menu span,
  body .site-header .hamburger-menu span {
    display: block !important;
    width: 22px !important;
    height: 2px !important;
    background: #f8fafc !important;
    border-radius: 2px !important;
    transition: all 0.3s ease !important;
  }

  /* App Sorter Grid: single column */
  .apps-grid,
  .apps-slider,
  #appsSlider {
    display: grid !important;
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }
  .apps-carousel-wrapper {
    padding: 0 34px !important;
  }
  .apps-nav-arrow.prev { left: 2px !important; }
  .apps-nav-arrow.next { right: 2px !important; }
  .app-card {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
  }
}
</style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1600 1200" width="1600" height="1200" xmlns="http://www.w3.org/2000/svg">
      <!-- Curved arrows connecting in a circle -->
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#059669" />
        </marker>
      </defs>
      
      <!-- Arrow 1: Cane to Transport (perfect circular arc - top to right) -->
      <path d="M 1050 180 Q 1450 200, 1450 450" stroke="#059669" stroke-width="8" fill="none" marker-end="url(#arrowhead)"/>
      
      <!-- Arrow 2: Transport to Weighbridge (perfect circular arc - right to bottom) -->
      <path d="M 1420 670 Q 1400 1000, 1050 1020" stroke="#059669" stroke-width="8" fill="none" marker-end="url(#arrowhead)"/>
      
      <!-- Arrow 3: Weighbridge to Labor (perfect circular arc - bottom to left) -->
      <path d="M 550 1020 Q 150 1000, 150 670" stroke="#059669" stroke-width="8" fill="none" marker-end="url(#arrowhead)"/>
      
      <!-- Arrow 4: Labor to Cane (perfect circular arc - left to top) -->
      <path d="M 180 450 Q 150 200, 550 180" stroke="#059669" stroke-width="8" fill="none" marker-end="url(#arrowhead)"/>
      
      <!-- Card 1: Cane Sourcing (Top) -->
      <g>
        <rect x="600" y="80" width="400" height="140" rx="6" fill="#A7F3D0" stroke="#059669" stroke-width="4"/>
        <text x="800" y="140" text-anchor="middle" font-size="32" font-weight="700" fill="#059669" font-family="'Roboto', sans-serif">Cane Sourcing</text>
        <text x="800" y="185" text-anchor="middle" font-size="32" font-weight="700" fill="#059669" font-family="'Roboto', sans-serif">Traceability</text>
      </g>
      
      <!-- Card 2: Transport & Workshop (Right) -->
      <g>
        <rect x="1200" y="480" width="360" height="160" rx="6" fill="#FED7AA" stroke="#EA580C" stroke-width="4"/>
        <text x="1380" y="540" text-anchor="middle" font-size="30" font-weight="700" fill="#EA580C" font-family="'Roboto', sans-serif">Transport &amp;</text>
        <text x="1380" y="580" text-anchor="middle" font-size="30" font-weight="700" fill="#EA580C" font-family="'Roboto', sans-serif">Workshop</text>
        <text x="1380" y="620" text-anchor="middle" font-size="30" font-weight="700" fill="#EA580C" font-family="'Roboto', sans-serif">Traceability</text>
      </g>
      
      <!-- Card 3: Weighbridge (Bottom) -->
      <g>
        <rect x="600" y="980" width="400" height="140" rx="6" fill="#DDD6FE" stroke="#7C3AED" stroke-width="4"/>
        <text x="800" y="1040" text-anchor="middle" font-size="32" font-weight="700" fill="#7C3AED" font-family="'Roboto', sans-serif">Weighbridge</text>
        <text x="800" y="1085" text-anchor="middle" font-size="32" font-weight="700" fill="#7C3AED" font-family="'Roboto', sans-serif">Traceability</text>
      </g>
      
      <!-- Card 4: Labor (Left) -->
      <g>
        <rect x="40" y="480" width="360" height="160" rx="6" fill="#FBCFE8" stroke="#DB2777" stroke-width="4"/>
        <text x="220" y="555" text-anchor="middle" font-size="32" font-weight="700" fill="#DB2777" font-family="'Roboto', sans-serif">Labor</text>
        <text x="220" y="600" text-anchor="middle" font-size="32" font-weight="700" fill="#DB2777" font-family="'Roboto', sans-serif">Traceability</text>
      </g>
      
      <!-- Center Box - AI (Same style as others) -->
      <g>
        <rect x="700" y="530" width="200" height="140" rx="6" fill="#f6dd0d" stroke="#686fb4" stroke-width="4"/>
        <text x="800" y="620" text-anchor="middle" font-size="52" font-weight="700" fill="#3b3b3b" font-family="'Sansation', 'Roboto', sans-serif">AI</text>
      </g>
    </svg>
  </div>
</body>
</html>
